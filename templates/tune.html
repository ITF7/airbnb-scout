<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scout scoring</title>
<style>
  :root {
    --bg: #0f1115; --surface: #171a21; --surface-2: #1f232c; --border: #2a2f3a; --text: #e6e8ee; --muted: #8b93a7;
    --blue: #5b8def; --blue-soft: rgba(91,141,239,.14); --purple: #9b7bf0; --purple-soft: rgba(155,123,240,.14);
    --red: #ef4444; --red-soft: rgba(239,68,68,.14); --green: #34d399;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 Inter, "Segoe UI", system-ui, sans-serif; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 13px; max-width: 70ch; }
  .layout { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 20px; margin-top: 18px; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .panel h2 { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin: 0 0 10px; font-weight: 600; }
  .group { border-top: 1px solid var(--border); padding: 12px 0 4px; }
  .group:first-of-type { border-top: 0; padding-top: 0; }
  .group > b { display: block; font-size: 14px; }
  .help { color: var(--muted); font-size: 12px; margin: 2px 0 8px; }
  .field { display: grid; grid-template-columns: 1fr 150px 64px; gap: 8px; align-items: center; margin: 4px 0; font-size: 13px; }
  .field label { color: var(--muted); }
  input[type=range] { width: 100%; accent-color: var(--blue); }
  input[type=number] { width: 100%; background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 7px; padding: 4px 6px; font: inherit; font-variant-numeric: tabular-nums; }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
  .bands { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; font-size: 12px; }
  .bands div { display: grid; gap: 3px; } .bands span { color: var(--muted); }
  select { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; font: inherit; max-width: 100%; }
  .btn { background: var(--blue); color: #fff; border: 0; border-radius: 9px; padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  .btn.ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .btn:disabled { opacity: .5; cursor: default; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .status { font-size: 12px; color: var(--muted); }
  .status.ok { color: var(--purple); } .status.err { color: #fca5a5; }
  .query { color: var(--muted); font-size: 13px; font-style: italic; margin: 8px 0 14px; }
  .list { display: grid; gap: 8px; }
  .row { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; display: grid; gap: 6px; }
  .row.top { border-color: var(--red); }
  .row .line { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto 64px; gap: 10px; align-items: center; }
  .rank { color: var(--muted); font-variant-numeric: tabular-nums; }
  .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { color: var(--muted); font-size: 12px; }
  .score { font-weight: 700; font-size: 16px; text-align: right; font-variant-numeric: tabular-nums; }
  .delta { font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .delta.up { color: var(--green); } .delta.down { color: #fca5a5; }
  .tag { font-size: 10.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em; padding: 2px 6px; border-radius: 5px; background: var(--surface-2); color: var(--muted); margin-left: 6px; }
  .tag.red { background: var(--red); color: #fff; } .tag.moved { background: var(--purple-soft); color: #cdbcff; }
  details summary { cursor: pointer; color: var(--blue); font-size: 12px; }
  .bd { display: grid; gap: 3px; margin-top: 6px; }
  .bd div { display: grid; grid-template-columns: 170px 1fr 48px; gap: 8px; align-items: center; font-size: 12px; }
  .bd .bar { height: 6px; background: var(--surface-2); border-radius: 99px; position: relative; overflow: hidden; }
  .bd .bar i { position: absolute; top: 0; bottom: 0; border-radius: 99px; background: linear-gradient(90deg, var(--blue), var(--purple)); }
  .bd .bar i.neg { background: var(--red); }
  .bd b { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  h3 { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin: 22px 0 8px; font-weight: 600; }
  .why { color: #fca5a5; font-size: 12px; }
  .empty { color: var(--muted); padding: 18px; text-align: center; border: 1px dashed var(--border); border-radius: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Scoring</h1>
      <div class="sub">Change how Scout scores listings and watch a saved search re-rank instantly. Nothing is searched again. Save when you're happy, and every version of Scout uses the new scoring.</div>
    </div>
    <div class="actions">
      <span class="status" id="status"></span>
      <button class="btn ghost" id="reset" type="button">Undo changes</button>
      <button class="btn" id="save" type="button" disabled>Save scoring</button>
    </div>
  </header>

  <div class="layout">
    <aside class="panel" id="controls"><h2>Points and rules</h2><div class="help">Loading…</div></aside>
    <main>
      <div class="panel">
        <label for="run" class="help" style="display:block;margin:0 0 6px">Test on a saved search</label>
        <select id="run"></select>
        <div class="query" id="query"></div>
      </div>
      <h3>Picks</h3>
      <div class="list" id="matches"></div>
      <h3>Near misses</h3>
      <div class="list" id="near"></div>
      <h3 id="droppedH" hidden>Now filtered out</h3>
      <div class="list" id="dropped"></div>
    </main>
  </div>
</div>
<script src="/tune.js"></script>
</body>
</html>
